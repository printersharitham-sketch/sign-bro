name: signbro
description: SIGN BRO - AI Powered Signage Marketplace
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  google_mlkit_text_recognition: ^0.15.0
  permission_handler: ^12.0.0
  ar_flutter_plugin: ^0.7.3
  google_maps_flutter: ^2.5.0
  image_picker: ^1.0.4
  http: ^1.1.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.1
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logo/
